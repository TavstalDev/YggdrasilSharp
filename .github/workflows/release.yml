# GitHub Actions workflow for validating and releasing
name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'stable'

permissions:
  contents: write

env:
  SLN_NAME: YggdrasilSharp.sln
  CSPROJ_PATH: ./YggdrasilSharp/YggdrasilSharp.csproj
  TEST_PROJECT: ./YggdrasilSharp.Tests/YggdrasilSharp.Tests.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os_name: linux-x64
          - rid: win-x64
            os_name: win-x64
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SLN_NAME }}

      - name: Build Solution
        run: dotnet build ${{ env.SLN_NAME }} --configuration Release --no-restore

      - name: Run Tests
        run: dotnet run --project ${{ env.TEST_PROJECT }} --configuration Debug

      - name: Publish (Self-Contained without PDBs)
        run: |
          dotnet publish ${{ env.CSPROJ_PATH }} \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o ./publish/${{ matrix.os_name }}

      - name: Archive Build Artifacts
        run: |
          cd ./publish/${{ matrix.os_name }}
          zip -r ../../YggdrasilSharp-${{ matrix.os_name }}.zip .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YggdrasilSharp-${{ matrix.os_name }}
          path: YggdrasilSharp-${{ matrix.os_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: YggdrasilSharp-*
          merge-multiple: true

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep -oE '<Version>[^<]+' "${{ env.CSPROJ_PATH }}" | head -1 | sed 's/<Version>//')
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -oE '<FileVersion>[^<]+' "${{ env.CSPROJ_PATH }}" | head -1 | sed 's/<FileVersion>//')
          fi
          VERSION=${VERSION:-1.0.0}
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Verify Tag Does Not Already Exist
        run: |
          TAG="v$RELEASE_VERSION"
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 && STATUS=0 \vert{}\vert{} STATUS=$?
          case "$STATUS" in
            0)
              echo "::error::Tag $TAG already exists on origin. Bump <Version> in ${{ env.CSPROJ_PATH }} before pushing."
              exit 1
              ;;
            2)
              echo "Tag $TAG is available."
              ;;
            *)
              echo "::error::Could not query origin for tag $TAG."
              exit 1
              ;;
          esac

      - name: Get latest tag
        id: get_latest_tag
        run: |
          git fetch --tags || true
          LATEST_TAG=$(git tag -l | sort -V | tail -n 1)
          echo "LATEST_TAG=${LATEST_TAG:-none}" >> $GITHUB_ENV

      - name: Prepare Release Body
        run: |
          git fetch --unshallow || true
          {
            echo "## Changelog"
            echo "Changes pushed to branch \`${{ github.ref_name }}\`"
            echo ""
            echo "<details>"
            echo "<summary>Click to expand commit list</summary>"
            echo ""
            if [ "$LATEST_TAG" = "none" ]; then
              git log HEAD --pretty=format:"- [%h](https://github.com/${{ github.repository }}/commit/%h) - %s"
            else
              git log "$LATEST_TAG..HEAD" --pretty=format:"- [%h](https://github.com/${{ github.repository }}/commit/%h) - %s"
            fi
            echo ""
            echo "</details>"
          } > /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          body_path: /tmp/release_body.md
          files: ./artifacts/*.zip
          generate_release_notes: false
